<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial=scale=1.0">
        <title>Quiz</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="quiz-page-style.css">
       

    </head>
    <body>

        <div class="quiz-languages">
            <header class="quiz-header">
                <h2 class="quiz-title">Choose a coding language:</h2>
            </header>
            <div class="quiz-content">
                <ul class="languages-options">
                    <li class="language-option" id="HTML">HTML</li>
                    <li class="language-option" id="CSS">CSS</li>   
                    <li class="language-option" id="JavaScript">JavaScript</li>
                    <li class="language-option" id="MixedLanguage">Mixed</li>
                </ul>
            </div>
            
            
            <div class="quiz-footer">
                <button class="next-difficulty-btn" >
                    Next <span class="material-symbols-rounded">arrow_right_alt</span>
                 </button>
            </div>
        </div>
   
        <div class="quiz-difficulties">
            <header class="quiz-header">
                <h2 class="quiz-title">Choose the quiz's difficulty:</h2>
            </header>
            <div class="quiz-content">
                <ul class="difficulty-options">
                    <li class="difficulty-option" id="Easy">Easy</li>
                    <li class="difficulty-option" id="Medium">Medium</li>   
                    <li class="difficulty-option" id="Hard">Hard</li>
                </ul>
            </div>
            
            
            <div class="quiz-footer">
                <button class="start-quiz-btn">
                    Start Quiz <span class="material-symbols-rounded">arrow_right_alt</span>
            </button>
        </div>
        </div>



    <div class="quiz-container">
            <header class="quiz-header">
                <h2 class="quiz-title">Quiz Application</h2>
                <div class="quiz-timer">
                    <span class="material-symbols-rounded">timer</span>
                    <p class="time-duration">30s</p>
                </div>
            </header>
            <div class="quiz-content">
                <h1 class="question-text">What is 2 + 2?</h1>
                <ul class="answer-options">
                    <li class="answer-option">3</li>
                    <li class="answer-option correct">4
                        <span class="material-symbols-rounded">check_circle</span>  
                    </li>   
                    <li class="answer-option">5
                    </li>
                    <li class="answer-option incorrect">22
                        <span class="material-symbols-rounded">cancel</span>  
                    </li>
                </ul>
            </div>
            
            
            <div class="quiz-footer">
                <p class="question-status"><b>1</b> of <b>10</b> Questions</p>
                <button class="next-question-btn">
                    Next <span class="material-symbols-rounded">arrow_right_alt</span>
            </button>
            </div>
    </div>

    <script src="quiz-page-script.js"></script>

    </body>
</html>
